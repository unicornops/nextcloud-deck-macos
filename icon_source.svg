<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Warm deck boards: deliberately nothing like Nextcloud's blue (#0082c9). -->
    <linearGradient id="deck" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E7AE68"/>
      <stop offset="100%" stop-color="#B66E36"/>
    </linearGradient>
    <linearGradient id="lane" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBF3E6"/>
      <stop offset="100%" stop-color="#F1E2C8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5A3214" flood-opacity="0.35"/>
    </filter>
    <filter id="puck" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#3D2410" flood-opacity="0.45"/>
    </filter>
    <clipPath id="tile"><rect width="1024" height="1024" rx="228"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#deck)"/>
    <!-- Plank seams -->
    <g stroke="#8E5326" stroke-opacity="0.35" stroke-width="6">
      <line x1="0" y1="170" x2="1024" y2="170"/>
      <line x1="0" y1="340" x2="1024" y2="340"/>
      <line x1="0" y1="510" x2="1024" y2="510"/>
      <line x1="0" y1="680" x2="1024" y2="680"/>
      <line x1="0" y1="850" x2="1024" y2="850"/>
    </g>
  </g>

  <!-- Three lanes: a kanban board laid out like shuffleboard courts -->
  <g filter="url(#shadow)">
    <rect x="166" y="176" width="196" height="672" rx="36" fill="url(#lane)"/>
    <rect x="414" y="176" width="196" height="672" rx="36" fill="url(#lane)"/>
    <rect x="662" y="176" width="196" height="672" rx="36" fill="url(#lane)"/>
  </g>
  <!-- Scoring lines at the top of each lane -->
  <g stroke="#D9C2A0" stroke-width="8" stroke-linecap="round">
    <line x1="196" y1="292" x2="332" y2="292"/>
    <line x1="444" y1="292" x2="580" y2="292"/>
    <line x1="692" y1="292" x2="828" y2="292"/>
  </g>

  <!-- Pucks as cards -->
  <g filter="url(#puck)" stroke="#FFFFFF" stroke-width="14">
    <circle cx="264" cy="392" r="62" fill="#E76F51"/>
    <circle cx="264" cy="560" r="62" fill="#E76F51"/>
    <circle cx="264" cy="728" r="62" fill="#E9C46A"/>
    <circle cx="512" cy="392" r="62" fill="#2A9D8F"/>
    <circle cx="760" cy="392" r="62" fill="#E9C46A"/>
  </g>
  <!-- A puck sliding up the middle lane -->
  <g stroke="#2A9D8F" stroke-linecap="round" stroke-opacity="0.55">
    <line x1="512" y1="700" x2="512" y2="780" stroke-width="14"/>
    <line x1="476" y1="712" x2="476" y2="764" stroke-width="10"/>
    <line x1="548" y1="712" x2="548" y2="764" stroke-width="10"/>
  </g>
  <circle cx="512" cy="616" r="62" fill="#2A9D8F" stroke="#FFFFFF" stroke-width="14" filter="url(#puck)"/>
</svg>
