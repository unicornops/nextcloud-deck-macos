name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to build (e.g., v1.2.3) - skips release-please and runs build only"
        required: true
        type: string
      dry_run:
        description: "Build, sign and notarize from the selected branch without uploading anything (for testing release changes)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  id-token: write
  packages: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.sha }}
  cancel-in-progress: false

env:
  SCHEME: Shuffleboard
  PROJECT: Shuffleboard.xcodeproj
  APP_NAME: Shuffleboard

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please only honours `prerelease` for 0.x versions, so make sure here: a release must be tested
      # and promoted (Promote Release workflow) before installed copies or Homebrew see it.
      - name: Publish as a pre-release
        if: steps.release.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease

  build:
    name: Build and Publish Release
    runs-on: macos-latest
    needs: release-please
    if: |
      always() &&
      (needs.release-please.outputs.releases_created == 'true' ||
       github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # A dry run builds the branch it was started from; otherwise the release tag.
          ref: ${{ inputs.dry_run && github.ref || needs.release-please.outputs.tag_name || inputs.tag_name }}

      - name: Set version
        id: version
        run: |
          TAG="${{ needs.release-please.outputs.tag_name || inputs.tag_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Show build environment
        run: |
          echo "Xcode version:"
          xcodebuild -version
          echo ""
          echo "Swift version:"
          swift --version
          echo ""
          echo "macOS version:"
          sw_vers

      - name: Install icon generation dependency
        run: brew install librsvg

      - name: Generate app icon
        run: ./generate-appicon.sh

      - name: Clean build directory
        run: rm -rf build/

      - name: Setup code signing
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEYCHAIN_NAME="build.keychain"
          KEYCHAIN_PASSWORD="temporary_password_$(uuidgen)"
          KEYCHAIN_PATH="$HOME/Library/Keychains/$KEYCHAIN_NAME-db"

          echo "Creating temporary keychain..."
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"

          echo "Configuring keychain settings..."
          security set-keychain-settings "$KEYCHAIN_NAME"

          echo "Unlocking keychain..."
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"

          echo "Adding to keychain search list..."
          security list-keychains -d user -s "$KEYCHAIN_NAME" $(security list-keychains -d user | sed s/\"//g)

          echo "Importing certificate..."
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          if [ ! -f "$CERTIFICATE_PATH" ]; then
            echo "Error: Certificate file was not created"
            exit 1
          fi

          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_NAME" \
            -T /usr/bin/codesign \
            -T /usr/bin/security || {
              echo "Error: Certificate import failed"
              exit 1
            }

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"

          IDENTITY_COUNT=$(security find-identity -v -p codesigning "$KEYCHAIN_NAME" | grep -c "Developer ID Application" || echo "0")
          if [ "$IDENTITY_COUNT" -eq "0" ]; then
            echo "Error: No Developer ID Application certificate found after import"
            exit 1
          fi

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_NAME" | grep "Developer ID Application" | head -1 | sed -n 's/.*"\(.*\)"/\1/p')
          CERT_TEAM_ID=$(echo "$IDENTITY" | sed -n 's/.*(\([^)]*\)).*/\1/p')
          if [ -z "$CERT_TEAM_ID" ]; then
            CERT_TEAM_ID="$TEAM_ID"
          fi

          echo "SIGNING_IDENTITY=$IDENTITY" >> $GITHUB_ENV
          echo "CERT_TEAM_ID=$CERT_TEAM_ID" >> $GITHUB_ENV
          echo "KEYCHAIN_NAME=$KEYCHAIN_NAME" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV

          echo "✅ Code signing certificate installed"

      - name: Build and sign release
        run: |
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"

          xcodebuild \
            -project ${{ env.PROJECT }} \
            -scheme ${{ env.SCHEME }} \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            GIT_COMMIT_HASH="${{ github.sha }}" \
            BUILD_REF="${{ steps.version.outputs.tag }}" \
            BUILD_DATE_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$CERT_TEAM_ID" \
            ENABLE_HARDENED_RUNTIME=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_NAME --options runtime --timestamp" \
            build

      - name: Find built app
        id: find-app
        run: |
          APP_PATH=$(find build -name "${{ env.APP_NAME }}.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: ${{ env.APP_NAME }}.app not found in build directory"
            exit 1
          fi
          APP_PATH=$(cd "$(dirname "$APP_PATH")" && pwd)/$(basename "$APP_PATH")
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT
          echo "Found app at: $APP_PATH"

      - name: Verify app bundle
        run: |
          APP_PATH="${{ steps.find-app.outputs.app_path }}"
          if [ ! -f "$APP_PATH/Contents/MacOS/${{ env.APP_NAME }}" ]; then
            echo "Error: Executable not found"
            exit 1
          fi
          if [ ! -f "$APP_PATH/Contents/Info.plist" ]; then
            echo "Error: Info.plist not found"
            exit 1
          fi
          echo "✓ App bundle verification successful"

      # Sparkle's helpers (XPC services, Autoupdate, Updater.app) must carry our Developer ID signature with the
      # hardened runtime and a timestamp for notarization. Sign inside-out, then re-sign the framework and the app,
      # keeping the app's entitlements. See https://sparkle-project.org/documentation/sandboxing/
      - name: Sign Sparkle for notarization
        run: |
          set -euo pipefail
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          APP_PATH="${{ steps.find-app.outputs.app_path }}"
          FW="$APP_PATH/Contents/Frameworks/Sparkle.framework"
          sign() { codesign -f -s "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_NAME" --options runtime --timestamp "$@"; }
          sign "$FW/Versions/B/XPCServices/Installer.xpc"
          sign --preserve-metadata=entitlements "$FW/Versions/B/XPCServices/Downloader.xpc"
          sign "$FW/Versions/B/Autoupdate"
          sign "$FW/Versions/B/Updater.app"
          sign "$FW"
          sign --preserve-metadata=entitlements,requirements,flags "$APP_PATH"
          echo "✅ Sparkle signed"

      - name: Verify code signature
        run: |
          APP_PATH="${{ steps.find-app.outputs.app_path }}"
          codesign -vvv --deep --strict "$APP_PATH"
          codesign -dvvv "$APP_PATH"
          echo "✅ Code signature verification successful"

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP_PATH="${{ steps.find-app.outputs.app_path }}"

          echo "Creating ZIP for notarization..."
          ditto -c -k --keepParent "$APP_PATH" NotarizeApp.zip

          AUTH=(--apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APPLE_PASSWORD")

          # Apple's notary service drops the odd request, and `notarytool submit --wait` gives up on the first
          # one. So submit and staple with retries, and poll the submission's status, tolerating failed polls.
          retry() {
            local attempt
            for attempt in 1 2 3; do
              "$@" && return 0
              echo "::warning::Attempt $attempt failed: $*"
              sleep $((attempt * 30))
            done
            return 1
          }
          submit() {
            xcrun notarytool submit NotarizeApp.zip "${AUTH[@]}" --output-format json > submission.json
          }

          echo "Submitting to Apple for notarization..."
          retry submit
          SUBMISSION_ID=$(jq -r '.id' submission.json)
          echo "Submission: $SUBMISSION_ID"

          echo "Waiting for notarization..."
          DEADLINE=$((SECONDS + 45 * 60))
          while true; do
            if xcrun notarytool info "$SUBMISSION_ID" "${AUTH[@]}" --output-format json > result.json; then
              STATUS=$(jq -r '.status' result.json)
              echo "Status: $STATUS"
              [ "$STATUS" != "In Progress" ] && break
            else
              echo "::warning::Couldn't fetch the notarization status; trying again"
            fi
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::Notarization still not finished after 45 minutes (submission $SUBMISSION_ID)"
              exit 1
            fi
            sleep 30
          done

          if [ "$STATUS" != "Accepted" ]; then
            xcrun notarytool log "$SUBMISSION_ID" "${AUTH[@]}" || true
            echo "::error::Notarization finished with status $STATUS"
            exit 1
          fi

          echo "Stapling notarization ticket..."
          retry xcrun stapler staple "$APP_PATH"

          echo "Verifying notarization..."
          xcrun stapler validate "$APP_PATH"
          spctl -a -vv "$APP_PATH"

          rm NotarizeApp.zip submission.json result.json
          echo "✅ App successfully notarized and stapled"

      - name: Get app info
        id: app-info
        run: |
          APP_PATH="${{ steps.find-app.outputs.app_path }}"
          PLIST_PATH="$APP_PATH/Contents/Info.plist"
          BUNDLE_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST_PATH")
          BUNDLE_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST_PATH")
          echo "bundle_version=$BUNDLE_VERSION" >> $GITHUB_OUTPUT
          echo "bundle_build=$BUNDLE_BUILD" >> $GITHUB_OUTPUT

      - name: Create DMG
        id: create-dmg
        run: |
          APP_PATH="${{ steps.find-app.outputs.app_path }}"
          VERSION="${{ steps.version.outputs.version }}"
          DMG_NAME="${{ env.APP_NAME }}-${VERSION}.dmg"
          VOLUME_NAME="Shuffleboard ${VERSION}"

          ./create-dmg.sh "$APP_PATH" "$DMG_NAME" "$VOLUME_NAME"

          if [ -f "$DMG_NAME" ]; then
            echo "✓ DMG created successfully: $DMG_NAME"
            ls -lh "$DMG_NAME"
          else
            echo "✗ DMG creation failed"
            exit 1
          fi

          echo "dmg_name=$DMG_NAME" >> $GITHUB_OUTPUT

      - name: Create ZIP archive
        id: create-zip
        run: |
          APP_PATH="${{ steps.find-app.outputs.app_path }}"
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="${{ env.APP_NAME }}-${VERSION}.zip"

          ditto -c -k --keepParent "$APP_PATH" "$ZIP_NAME"

          if [ -f "$ZIP_NAME" ]; then
            echo "✓ ZIP created successfully: $ZIP_NAME"
            ls -lh "$ZIP_NAME"
          else
            echo "✗ ZIP creation failed"
            exit 1
          fi

          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT

      # The appcast at releases/latest/download/appcast.xml is what installed copies check (SUFeedURL).
      - name: Generate Sparkle appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_VERSION: 2.10.0
          SPARKLE_SHA256: c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c
        run: |
          set -euo pipefail
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "Error: SPARKLE_ED_PRIVATE_KEY secret is not set"
            exit 1
          fi
          curl -fsSL -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          echo "${SPARKLE_SHA256}  sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf sparkle.tar.xz -C "$RUNNER_TEMP/sparkle" ./bin/sign_update
          rm sparkle.tar.xz

          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          BUILD="${{ steps.app-info.outputs.bundle_build }}"
          ZIP_NAME="${{ steps.create-zip.outputs.zip_name }}"
          # The key goes in on stdin and is never written to disk.
          SIGNATURE=$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file - "$ZIP_NAME")
          REPO_URL="https://github.com/${{ github.repository }}"
          PUB_DATE=$(LC_ALL=C date -u "+%a, %d %b %Y %H:%M:%S +0000")

          cat > appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Shuffleboard</title>
              <link>${REPO_URL}</link>
              <item>
                <title>Shuffleboard ${VERSION}</title>
                <pubDate>${PUB_DATE}</pubDate>
                <sparkle:version>${BUILD}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                <sparkle:releaseNotesLink>${REPO_URL}/releases/tag/${TAG}</sparkle:releaseNotesLink>
                <enclosure url="${REPO_URL}/releases/download/${TAG}/${ZIP_NAME}" ${SIGNATURE} type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          EOF
          xmllint --noout appcast.xml
          cat appcast.xml

      - name: Calculate checksums
        run: |
          DMG_NAME="${{ steps.create-dmg.outputs.dmg_name }}"
          ZIP_NAME="${{ steps.create-zip.outputs.zip_name }}"
          shasum -a 256 "$DMG_NAME" > checksums.txt
          shasum -a 256 "$ZIP_NAME" >> checksums.txt
          cat checksums.txt

      - name: Cleanup certificate
        if: always()
        run: |
          echo "Cleaning up keychain..."
          security delete-keychain "$KEYCHAIN_NAME" 2>/dev/null || true
          echo "Certificate cleanup complete"

      - name: Upload release assets
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          DMG_NAME="${{ steps.create-dmg.outputs.dmg_name }}"
          ZIP_NAME="${{ steps.create-zip.outputs.zip_name }}"

          gh release upload "$TAG" "$DMG_NAME" "$ZIP_NAME" checksums.txt appcast.xml --clobber

      - name: Release summary
        run: |
          echo "## Release Build Summary 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: ${{ steps.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Bundle Version**: ${{ steps.app-info.outputs.bundle_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Bundle Build**: ${{ steps.app-info.outputs.bundle_build }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Xcode**: $(xcodebuild -version | head -n 1)" >> $GITHUB_STEP_SUMMARY
          echo "- **Swift**: $(swift --version | head -n 1)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔐 Security" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Code signed with Developer ID" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Notarized by Apple" >> $GITHUB_STEP_SUMMARY
          echo "- 🧪 Published as a **pre-release**: installed copies and Homebrew don't see it yet." >> $GITHUB_STEP_SUMMARY
          echo "  Test it, then run the **Promote Release** workflow to make it the full release." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Assets Uploaded" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- DMG: \`${{ steps.create-dmg.outputs.dmg_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- ZIP: \`${{ steps.create-zip.outputs.zip_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎉 **Release**: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
